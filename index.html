<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DocsHub — ระบบจัดการเอกสาร HR</title>
  <meta name="description" content="ระบบจัดการเอกสาร HR และออกเอกสารอัตโนมัติ (DocsHub Enterprise)" />
  <meta name="theme-color" content="#032d60" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DocsHub" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #032d60;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    }
    #app-frame {
      width: 100vw;
      height: 100dvh;
      border: 0;
      display: block;
      background: #f8fafc;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: linear-gradient(135deg, #0a2540 0%, #032d60 100%);
      color: #fff;
      transition: opacity 0.25s ease;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #pwa-banner {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 100;
      max-width: 410px;
      width: calc(100vw - 32px);
      background: linear-gradient(90deg, #0a2540 0%, #032d60 100%);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.38);
      display: none;
      align-items: center;
      gap: 12px;
    }
    #pwa-banner.show { display: flex; }
    #pwa-banner img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    #pwa-banner .meta { flex: 1; min-width: 0; }
    #pwa-banner .title { font-size: 14px; font-weight: 700; line-height: 1.2; }
    #pwa-banner .sub { font-size: 11px; color: #bfdbfe; margin-top: 2px; line-height: 1.3; }
    #pwa-install-btn {
      background: #fbbf24;
      color: #032d60;
      border: 0;
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }
    #pwa-install-btn:hover { background: #fcd34d; }
    #pwa-close-btn {
      background: transparent;
      border: 0;
      color: rgba(191,219,254,0.75);
      font-size: 15px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="./icon-192.png" alt="DocsHub" width="72" height="72" style="border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.35)" />
    <div style="font-size:18px;font-weight:700;letter-spacing:0.3px;">DocsHub</div>
    <div class="spinner"></div>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbx7pJ9sKgBd2jwN5bBdatGDEInFF1SYNWZ2mqYl7VN1StwWUj-G-JeN9tLo1r7sg2E/exec?pwa=1"
    allow="clipboard-read; clipboard-write; fullscreen"
    title="DocsHub Web App"
  ></iframe>

  <div id="pwa-banner" role="dialog" aria-label="ติดตั้งแอป DocsHub">
    <img src="./icon-192.png" alt="DocsHub" />
    <div class="meta">
      <div class="title">ติดตั้งแอป DocsHub ลงหน้าจอ</div>
      <div class="sub">กดปุ่มเดียวเพื่อสร้างไอคอนบน Desktop / มือถือ</div>
    </div>
    <button id="pwa-install-btn" type="button" style="display:inline-flex;align-items:center;gap:6px;">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
      <span>ติดตั้งแอป</span>
    </button>
    <button id="pwa-close-btn" type="button" title="ปิดไว้ก่อน">✕</button>
  </div>

  <script>
    (function () {
      const frame = document.getElementById('app-frame');
      const splash = document.getElementById('splash');
      const banner = document.getElementById('pwa-banner');
      const installBtn = document.getElementById('pwa-install-btn');
      const closeBtn = document.getElementById('pwa-close-btn');

      let deferredPrompt = null;
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

      frame.addEventListener('load', () => {
        splash.classList.add('hidden');
        try {
          frame.contentWindow.postMessage({
            type: 'DOCSHUB_PWA_STATUS',
            canPrompt: !!deferredPrompt,
            isStandalone: isStandalone
          }, '*');
        } catch (_) {}
      });
      setTimeout(() => splash.classList.add('hidden'), 6000);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      }

      function showBannerIfEligible() {
        if (isStandalone) return;
        if (deferredPrompt) {
          banner.classList.add('show');
        }
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showBannerIfEligible();
        try {
          frame.contentWindow.postMessage({
            type: 'DOCSHUB_PWA_STATUS',
            canPrompt: true,
            isStandalone: isStandalone
          }, '*');
        } catch (_) {}
      });

      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        banner.classList.remove('show');
      });

      async function triggerInstall() {
        if (!deferredPrompt) {
          alert('หากยังไม่ขึ้นหน้าต่างติดตั้งอัตโนมัติ ให้กดที่ไอคอนติดตั้ง (🖥⬇) ที่แถบ URL ด้านขวาบนของเบราว์เซอร์ Chrome / Edge เพื่อสร้างไอคอนบน Desktop ได้เลยครับ');
          return;
        }
        deferredPrompt.prompt();
        const result = await deferredPrompt.userChoice;
        if (result && result.outcome === 'accepted') {
          deferredPrompt = null;
          banner.classList.remove('show');
        }
      }

      installBtn.addEventListener('click', triggerInstall);
      closeBtn.addEventListener('click', () => banner.classList.remove('show'));

      window.addEventListener('message', (event) => {
        if (!event.data) return;
        if (event.data.type === 'DOCSHUB_PING_SHELL' && event.source) {
          try {
            event.source.postMessage({
              type: 'DOCSHUB_PWA_STATUS',
              canPrompt: !!deferredPrompt,
              isStandalone: isStandalone
            }, '*');
          } catch (_) {}
        }
        if (event.data.type === 'DOCSHUB_TRIGGER_PWA_INSTALL') {
          triggerInstall();
        }
      });
    })();
  </script>
</body>
</html>
